<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title/description for the instant before React mounts and
         sets per-route tags via PageSeo. Keep this in sync with Landing.tsx's
         PageSeo props, but never add rel=canonical or og:url/twitter here --
         PageSeo owns those per-route and a static duplicate here previously
         shadowed the per-page canonical on every route but the homepage,
         keeping /javascript-compiler and /react-playground out of Google's
         index for a week. -->
    <title>CodeShare — Real-Time Collaborative Code Editor Online</title>
    <meta
      name="description"
      content="Write and run HTML, CSS, and JavaScript together in real time. Share one link, see everyone's edits and the live output instantly — no sign-up required."
    />
    <meta name="google-site-verification" content="8qcbpfiFRruo_PCHlH4sl5LR68TJgO_jImYGB6QAJVM" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeShare" />
    <meta property="og:image" content="https://codeshare.in/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://codeshare.in/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
